<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntegriSpace 2.0 - Registro</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .register-layout {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        .register-header {
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }
        .register-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .register-header p {
            color: var(--texto-gris);
            font-size: 14px;
        }
        .form-container {
            width: 100%;
            margin-top: 20px;
            flex: 1;
        }
        .login-input {
            width: 100%;
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde-tarjeta);
            padding: 15px;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .login-input:focus {
            border-color: #3b82f6;
        }
        .btn-register {
            width: 100%;
            background: var(--gradiente-morado);
            border: none;
            padding: 16px;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .back-to-login {
            color: var(--texto-gris);
            font-size: 14px;
            margin-top: 25px;
            text-align: center;
        }
        .back-to-login a {
            color: #6366f1;
            text-decoration: none;
            font-weight: bold;
        }
        
        .msg-error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.25);
            font-size: 13px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: center;
            display: none;
        }

        /* --- MODAL OSCURO ADAPTATIVO COHERENTE --- */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 10000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .custom-modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }
        .custom-modal-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }
        .custom-modal-overlay.active .custom-modal-card {
            transform: scale(1);
        }
        .custom-modal-title {
            color: #ffffff; font-size: 18px; font-weight: 700; margin-bottom: 8px;
        }
        .custom-modal-text {
            color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 20px;
        }
        .btn-modal-confirm {
            background: #6366f1; color: #ffffff;
            padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: none; width: 100%; transition: background 0.2s;
        }
        .btn-modal-confirm:hover { background: #4f46e5; }

        /* =========================================================
           SOPORTE DE ACCESIBILIDAD EMPAREJADO CON TU SCRIPT.JS
           ========================================================= */
        body.large-text .register-header h2 { font-size: 36px !important; }
        body.large-text .register-header p { font-size: 18px !important; }
        body.large-text .login-input { font-size: 18px !important; padding: 18px; }
        body.large-text .btn-register { font-size: 18px !important; }
        body.large-text .back-to-login { font-size: 16px !important; }
        body.large-text .custom-modal-title { font-size: 22px !important; }
        body.large-text .custom-modal-text { font-size: 16px !important; }

        body.high-contrast {
            background-color: #000000 !important;
        }
        body.high-contrast .register-layout {
            background-color: #000000 !important;
        }
        body.high-contrast .register-header h2,
        body.high-contrast .register-header p,
        body.high-contrast .back-to-login,
        body.high-contrast .custom-modal-title,
        body.high-contrast .custom-modal-text {
            color: #ffffff !important;
        }
        body.high-contrast .login-input {
            background-color: #000000 !important;
            border: 2px solid #ffffff !important;
            color: #ffffff !important;
        }
        body.high-contrast .login-input::placeholder {
            color: #ffffff !important;
            opacity: 0.8;
        }
        body.high-contrast .btn-register,
        body.high-contrast .btn-modal-confirm {
            background: #ffffff !important;
            color: #000000 !important;
            font-weight: 900 !important;
            border: 2px solid #000000 !important;
        }
        body.high-contrast .back-to-login a {
            color: #ffff00 !important;
            text-decoration: underline !important;
        }
        body.high-contrast .custom-modal-card {
            background: #000000 !important;
            border: 2px solid #ffffff !important;
        }
    </style>
    
    <script>
        if (localStorage.getItem('access_large_text') === 'true') document.documentElement.classList.add('large-text');
        if (localStorage.getItem('access_high_contrast') === 'true') document.documentElement.classList.add('high-contrast');
    </script>
</head>
<body>

    <div class="wrapper-movil">
        <div class="contenido-app">
            <div class="register-layout">
                
                <div class="register-header">
                    <h2 data-es="Crear Cuenta" data-en="Create Account">Crear Cuenta</h2>
                    <p data-es="Regístrate para empezar a evaluar rutas" data-en="Register to start evaluating routes">Regístrate para empezar a evaluar rutas</p>
                </div>

                <div class="form-container">
                    <form id="registerForm">
                        <div id="errorMsg" class="msg-error" data-es="Por favor, rellena todos los campos correctamente." data-en="Please fill out all fields correctly.">Por favor, rellena todos los campos correctamente.</div>
                        
                        <input type="text" id="regNombre" class="login-input" placeholder="Nombre" data-placeholder-es="Nombre" data-placeholder-en="First Name" required>
                        <input type="text" id="regApellido" class="login-input" placeholder="Apellido" data-placeholder-es="Apellido" data-placeholder-en="Last Name" required>
                        <input type="text" id="regUsername" class="login-input" placeholder="Nombre de usuario" data-placeholder-es="Nombre de usuario" data-placeholder-en="Username" required>
                        <input type="email" id="regEmail" class="login-input" placeholder="Correo electrónico" data-placeholder-es="Correo electrónico" data-placeholder-en="Email address" required>
                        <input type="password" id="regPassword" class="login-input" placeholder="Contraseña" data-placeholder-es="Contraseña" data-placeholder-en="Password" required>
                        
                        <button type="submit" id="btnEjecutarRegistro" class="btn-register" data-es="Registrarse" data-en="Register">Registrarse</button>
                    </form>

                    <p class="back-to-login">
                        <span data-es="¿Ya tienes cuenta?" data-en="Already have an account?">¿Ya tienes cuenta?</span> 
                        <a href="index.html" data-es="Inicia sesión" data-en="Sign In">Inicia sesión</a>
                    </p>
                </div>

                <img src="../assets/logo_ucv.png" alt="UCV" style="width: 65px; margin-top: 20px;">

            </div>
        </div>
    </div>

    <div id="successModal" class="custom-modal-overlay">
        <div class="custom-modal-card">
            <div class="custom-modal-title" data-es="¡Registro Exitoso!" data-en="Successful Registration!">¡Registro Exitoso!</div>
            <p class="custom-modal-text" data-es="Tu cuenta ha sido creada correctamente. Ahora puedes iniciar sesión." data-en="Your account has been successfully created. Now you can log in.">Tu cuenta ha sido creada correctamente. Ahora puedes iniciar sesión.</p>
            <button id="btnModalAccept" class="btn-modal-confirm" data-es="Aceptar" data-en="Accept">Aceptar</button>
        </div>
    </div>

    <script src="../js/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Sincronizar el idioma actual usando la función exacta de tu script.js
            const idiomaActual = localStorage.getItem('app_lang') || 'es';
            if (typeof aplicarIdioma === 'function') {
                aplicarIdioma(idiomaActual);
            }

            // Sincronizar textos manuales especiales (como el span interno del link)
            document.querySelectorAll('[data-es]').forEach(elem => {
                const txt = elem.getAttribute(`data-${idiomaActual}`);
                if (txt && elem.classList.contains('back-to-login')) {
                    const subSpan = elem.querySelector('span');
                    if (subSpan) subSpan.textContent = txt;
                }
            });

            const registerForm = document.getElementById('registerForm');
            const btnEjecutarRegistro = document.getElementById('btnEjecutarRegistro');
            const errorMsg = document.getElementById('errorMsg');
            const successModal = document.getElementById('successModal');
            const btnModalAccept = document.getElementById('btnModalAccept');

            if (registerForm && btnEjecutarRegistro) {
                // Interceptamos el click antes de que el formulario dispare el "submit" global
                btnEjecutarRegistro.addEventListener('click', (e) => {
                    const nombre = document.getElementById('regNombre').value.trim();
                    const apellido = document.getElementById('regApellido').value.trim();
                    const username = document.getElementById('regUsername').value.trim();
                    const email = document.getElementById('regEmail').value.trim().toLowerCase();
                    const password = document.getElementById('regPassword').value;

                    // Si falta algún campo obligatorio, dejamos que el formulario maneje su validación visual
                    if (!nombre || !apellido || !username || !email || !password) {
                        errorMsg.style.display = 'block';
                        return;
                    }

                    // Detenemos por completo la propagación para que script.js no ejecute su alert()
                    e.preventDefault();
                    e.stopPropagation();

                    errorMsg.style.display = 'none';

                    // Guardamos estructurado exactamente igual que tu lógica central
                    const usuarioNuevo = { nombre, apellido, username, email, password };
                    localStorage.setItem('usuarioRegistrado', JSON.stringify(usuarioNuevo));

                    // Levantamos el modal integrado directamente en la interfaz del aplicativo
                    if (successModal) {
                        successModal.classList.add('active');
                    }
                });

                // Evitamos recargas accidentales si presionan Enter
                registerForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                });
            }

            if (btnModalAccept) {
                btnModalAccept.addEventListener('click', () => {
                    if (successModal) successModal.classList.remove('active');
                    window.location.href = "index.html";
                });
            }
        });
    </script>
</body>
</html>
