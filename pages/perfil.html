<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntegriSpace 2.0 - Perfil</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .profile-layout, .profile-layout * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .profile-layout {
            display: flex;
            flex-direction: column;
            gap: 18px; 
            padding: 20px 12px 20px 12px;
        }
        .profile-header {
            text-align: center;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .avatar-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }
        .avatar-box svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }
        .profile-info h2 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }
        .profile-info p {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #a855f7;
            margin-bottom: 2px;
            display: block;
            letter-spacing: 0.5px;
        }
        .info-card {
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Estructura limpia de filas del listado */
        .list-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .list-row:last-of-type {
            border-bottom: none;
            padding-bottom: 0;
        }
        .list-row-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .list-row-left svg {
            width: 18px;
            height: 18px;
            fill: #94a3b8;
        }
        .list-row-left label {
            font-size: 14px;
            color: #ffffff;
            font-weight: 500;
        }

        /* Contenedores de entrada e interactivos */
        .weight-input-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .txt-weight, .custom-input-date, .clean-select-interactive {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }
        .txt-weight {
            width: 65px;
            text-align: center;
            padding: 4px;
        }
        .custom-input-date {
            padding: 4px 8px;
            font-family: inherit;
            text-align: right;
        }
        .weight-unit {
            font-size: 13px;
            color: #a855f7;
            font-weight: 700;
        }

        /* selectores estilo Dropdown interactivo */
        .clean-select-interactive {
            background: transparent;
            border: none;
            color: #a855f7;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 18px 4px 4px; 
            text-align: right;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 100%;
        }

        /* Forzar el fondo oscuro en el desplegable nativo */
        .clean-select-interactive option {
            background-color: #1e293b; 
            color: #ffffff; 
        }

        /* Flecha del selector */
        .select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            max-width: 190px; 
        }
        
        .select-wrapper::before {
            content: "▼";
            font-size: 9px;
            color: #a855f7;
            position: absolute;
            right: 2px;
            pointer-events: none;
        }

        /* Botones de acción */
        .btn-save {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            transition: all 0.2s;
        }
        .btn-save:hover {
            opacity: 0.95;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
        }
        
        /* Botón de cierre de sesión */
        .btn-logout {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s;
        }
        .btn-logout:hover { 
            background: rgba(239, 68, 68, 0.2); 
            transform: scale(1.05);
        }

        /* Configuración de la barra de navegación adaptada */
        .custom-bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0c1428; 
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px 0;
            z-index: 9999;
            border-radius: 0 0 30px 30px;
        }
        .custom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #55657e;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            width: 65px;
            background: none; 
            border: none;     
            padding: 0;
        }
        .custom-nav-item.active { 
            color: #a855f7; 
        }
        .custom-nav-item svg { 
            width: 24px; 
            height: 24px; 
            display: block; 
        }

        /* Estilos para el cambio de tema claro */
        body.light-theme { background-color: #f8fafc; }
        body.light-theme .profile-info h2 { color: #0f172a; }
        body.light-theme .profile-info p { color: #64748b; }
        body.light-theme .info-card { background: #ffffff; border-color: #e2e8f0; }
        body.light-theme .list-row { border-bottom-color: #e2e8f0; }
        body.light-theme .list-row-left label { color: #334155; }
        body.light-theme .list-row-left svg { fill: #64748b; }
        body.light-theme .txt-weight, body.light-theme .custom-input-date { background: #ffffff; border-color: #cbd5e1; color: #0f172a; }
        body.light-theme .btn-logout { background: rgba(239, 68, 68, 0.08); }
        body.light-theme .clean-select-interactive option { background-color: #ffffff; color: #0f172a; }

        /* Alerta interna de la App */
        .custom-internal-alert {
            position: absolute;
            top: -100px;
            left: 12px;
            right: 12px;
            background-color: #1e293b;
            border-left: 4px solid #10b981;
            padding: 14px 16px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-internal-alert.show {
            top: 15px;
        }
        .alert-text {
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 600;
        }
        .alert-close-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="wrapper-movil" style="position: relative; overflow: hidden;">
        
        <div class="custom-internal-alert" id="appInternalAlert">
            <span class="alert-text" id="appInternalAlertText">¡Preferencias guardadas exitosamente!</span>
            <button class="alert-close-btn" id="appInternalAlertBtn">Aceptar</button>
        </div>
        
        <button class="btn-logout" id="btnExitSession" title="Cerrar sesión">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
        </button>

        <div class="contenido-app">
            <div class="profile-layout">
                
                <div class="profile-header">
                    <div class="avatar-box">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                    <div class="profile-info">
                        <h2 id="lblProfileUser">Cargando...</h2>
                        <p id="lblProfileEmail">cargando@integrispace.com</p>
                    </div>
                </div>

                <span class="section-title">Información Personal</span>
                <div class="info-card">

                    <div class="list-row">
                        <div class="list-row-left">
                            <svg viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2v1.08c3.39.49 6 3.39 6 6.92 0 3.87-3.13 7-7 7s-7-3.13-7-7c0-3.53 2.61-6.43 6-6.92V4c0-1.1.9-2 2-2zm0 18c4.41 0 8-3.59 8-8s-3.59-8-8-8-8 3.59-8 8 3.59 8 8 8z"/></svg>
                            <label for="txtWeightValue">Peso corporal</label>
                        </div>
                        <div class="weight-input-container">
                            <input type="number" id="txtWeightValue" class="txt-weight" value="70" min="20" max="250">
                            <span class="weight-unit">kg</span>
                        </div>
                    </div>

                    <div class="list-row">
                        <div class="list-row-left">
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            <label for="gridMobility">Tipo de usuario</label>
                        </div>
                        <div class="select-wrapper">
                            <select id="gridMobility" class="clean-select-interactive">
                                <option value="general">Usuario General</option>
                                <option value="movilidad">Movilidad Reducida</option>
                                <option value="runner">Runner</option>
                                <option value="turista">Turista</option>
                            </select>
                        </div>
                    </div>

                    <div class="list-row">
                        <div class="list-row-left">
                            <svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 21.5h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.7-1.1-1-1.8-1-.3 0-.5.1-.8.1L6 8.3v5.2h2V9.9l1.8-1z"/></svg>
                            <label for="gridPace">Nivel de actividad</label>
                        </div>
                        <div class="select-wrapper">
                            <select id="gridPace" class="clean-select-interactive">
                                <option value="camina" id="paceCamina">🚶 Camina tranquilo</option>
                                <option value="prisa" id="pacePrisa">⚡ Va con prisa</option>
                                <option value="corre" id="paceCorre">🏃 Trote / Corre</option>
                                <option value="explora" id="paceExplora">📸 Explora el área</option>
                            </select>
                        </div>
                    </div>

                    <div class="list-row">
                        <div class="list-row-left">
                            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
                            <label for="txtBirthdate">Fecha de nacimiento</label>
                        </div>
                        <input type="date" id="txtBirthdate" class="custom-input-date">
                    </div>

                </div>

                <span class="section-title">Personalización</span>
                <div class="info-card">
                    <div class="list-row">
                        <div class="list-row-left">
                            <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-3zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
                            <label for="selTheme">Tema de la app</label>
                        </div>
                        <div class="select-wrapper">
                            <select id="selTheme" class="clean-select-interactive">
                                <option value="device">Según dispositivo</option>
                                <option value="dark">Oscuro</option>
                                <option value="light">Claro</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button class="btn-save" id="btnSaveConfig">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Guardar preferencias
                </button>

            </div>
        </div>

        <nav class="custom-bottom-nav">
            <a href="dashboard.html" class="custom-nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z" fill="#f97316"/>
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z" fill="#22c55e"/>
                </svg>
                <span>Inicio</span>
            </a>
            <a href="historial.html" class="custom-nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6z" fill="#fef08a"/>
                    <path d="M13 9V3.5L18.5 9H13z" fill="#ca8a04"/>
                </svg>
                <span>Historial</span>
            </a>
            <a href="ruta.html" class="custom-nav-item">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="#a855f7"/>
                </svg>
                <span>Ruta</span>
            </a>
            <a href="perfil.html" class="custom-nav-item active">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="7" r="4" fill="#c084fc"/>
                    <path d="M12 14c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#a855f7"/>
                </svg>
                <span>Perfil</span>
            </a>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. SISTEMA INTELIGENTE DE DETECCIÓN DE REGISTROS (Mapeo dinámico)
            let usuarioActiva = localStorage.getItem('user_name') || localStorage.getItem('username') || localStorage.getItem('sesionActiva');
            let correoActivo = localStorage.getItem('user_email') || localStorage.getItem('email') || localStorage.getItem('correo');

            if (!usuarioActiva || usuarioActiva === "Usuario General") {
                usuarioActiva = Object.keys(localStorage)
                    .map(key => localStorage.getItem(key))
                    .find(val => val && !val.includes('@') && val.length > 2 && val !== "device" && val !== "dark" && val !== "light" && val !== "general" && val !== "camina") || "Usuario General";
            }

            if (!correoActivo || correoActivo === "usuario@integrispace.com") {
                correoActivo = Object.keys(localStorage)
                    .map(key => {
                        try {
                            return JSON.parse(localStorage.getItem(key));
                        } catch (e) {
                            return null;
                        }
                    })
                    .find(obj => obj && obj.email)
                    ?.email || "usuario@integrispace.com";
            }
            
            // Pintar los datos dinámicos obtenidos inmediatamente
            document.getElementById('lblProfileUser').textContent = usuarioActiva;
            document.getElementById('lblProfileEmail').textContent = correoActivo;

            // Elementos de la interfaz
            const txtWeightValue = document.getElementById('txtWeightValue');
            const txtBirthdate = document.getElementById('txtBirthdate');
            const selTheme = document.getElementById('selTheme');
            const selectMobility = document.getElementById('gridMobility');
            const selectPace = document.getElementById('gridPace');

            const paceCamina = document.getElementById('paceCamina');
            const pacePrisa = document.getElementById('pacePrisa');
            const paceCorre = document.getElementById('paceCorre');

            // Control de Alerta interna
            const internalAlert = document.getElementById('appInternalAlert');
            const internalAlertText = document.getElementById('appInternalAlertText');
            const internalAlertBtn = document.getElementById('appInternalAlertBtn');

            function showCustomAlert(message, callback = null) {
                internalAlertText.textContent = message;
                internalAlert.classList.add('show');
                
                const newBtn = internalAlertBtn.cloneNode(true);
                internalAlertBtn.parentNode.replaceChild(newBtn, internalAlertBtn);
                
                newBtn.addEventListener('click', () => {
                    internalAlert.classList.remove('show');
                    if (callback) callback();
                });
            }

            // Cargar datos guardados del perfil
            const savedWeight = localStorage.getItem('user_weight');
            const savedProfile = localStorage.getItem('user_profile');
            const savedPace = localStorage.getItem('user_pace');
            const savedBirthdate = localStorage.getItem('user_birthdate');
            const savedTheme = localStorage.getItem('user_theme') || 'device';

            if (savedWeight) txtWeightValue.value = savedWeight;
            if (savedBirthdate) txtBirthdate.value = savedBirthdate;
            selTheme.value = savedTheme;

            // Manejo de Temas
            function applyTheme(themeMode) {
                if (themeMode === 'light') {
                    document.body.classList.add('light-theme');
                } else if (themeMode === 'dark') {
                    document.body.classList.remove('light-theme');
                } else {
                    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                    document.body.classList.toggle('light-theme', prefersLight);
                }
            }

            selTheme.addEventListener('change', (e) => applyTheme(e.target.value));
            applyTheme(savedTheme);

            // Textos Inclusivos dinámicos
            function renderInclusiveTexts(perfil) {
                if (perfil === "movilidad") {
                    paceCamina.text = "♿ Movilidad reducida (Base)";
                    pacePrisa.text = "⚡ Movilidad reducida (Rápido)";
                    paceCorre.text = "💪 Movilidad reducida (Intenso)";
                } else {
                    paceCamina.text = "🚶 Camina tranquilo";
                    pacePrisa.text = "⚡ Va con prisa";
                    paceCorre.text = "🏃 Trote / Corre";
                }
            }

            if (savedProfile) {
                selectMobility.value = savedProfile;
                renderInclusiveTexts(savedProfile);
            } else {
                renderInclusiveTexts('general');
            }

            if (savedPace) selectPace.value = savedPace;

            // Reactividad del selector de tipo de usuario
            selectMobility.addEventListener('change', () => {
                const perfil = selectMobility.value;
                renderInclusiveTexts(perfil);
                
                if (perfil === "movilidad") selectPace.value = "camina";
                else if (perfil === "runner") selectPace.value = "corre";
                else if (perfil === "turista") selectPace.value = "explora";
                else selectPace.value = "camina";
            });

            // Guardar Preferencias
            document.getElementById('btnSaveConfig').addEventListener('click', () => {
                localStorage.setItem('user_weight', txtWeightValue.value);
                localStorage.setItem('user_profile', selectMobility.value || 'general');
                localStorage.setItem('user_pace', selectPace.value || 'camina');
                localStorage.setItem('user_birthdate', txtBirthdate.value);
                localStorage.setItem('user_theme', selTheme.value);

                localStorage.setItem('user_email', correoActivo);
                localStorage.setItem('user_name', usuarioActiva);

                showCustomAlert("¡Preferencias guardadas exitosamente!");
            });

            // Cierre seguro de sesión
            document.getElementById('btnExitSession').addEventListener('click', () => {
                localStorage.clear();
                sessionStorage.clear();
                showCustomAlert("Cerrando sesión de forma segura...", () => {
                    window.location.replace('../index.html');
                });
            });
        });
    </script>
</body>
</html>
