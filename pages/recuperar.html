<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntegriSpace 2.0 - Recuperar Contraseña</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .recover-layout {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        .recover-header {
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }
        .recover-header h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .recover-header p {
            color: var(--texto-gris);
            font-size: 14px;
            line-height: 1.4;
            padding: 0 10px;
        }
        .form-container {
            width: 100%;
            margin-top: 30px;
            flex: 1;
        }
        .login-input {
            width: 100%;
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde-tarjeta);
            padding: 16px;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }
        .login-input:focus {
            border-color: #3b82f6;
        }
        .btn-recover {
            width: 100%;
            background: var(--gradiente-morado);
            border: none;
            padding: 16px;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .back-to-login {
            color: var(--texto-gris);
            font-size: 14px;
            margin-top: 25px;
            text-align: center;
        }
        .back-to-login a {
            color: #6366f1;
            text-decoration: none;
            font-weight: bold;
        }
        .msg-status {
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }
        .msg-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .msg-success {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body>

    <div class="wrapper-movil">
        <div class="contenido-app">
            <div class="recover-layout">
                
                <div class="recover-header">
                    <h2>¿Olvidaste tu contraseña?</h2>
                    <p>Ingresa tu correo electrónico institucional para enviarte las instrucciones de recuperación.</p>
                </div>

                <div class="form-container">
                    <form id="recoverForm">
                        <div id="recoverStatus" class="msg-status"></div>
                        
                        <input type="email" id="recoverEmail" class="login-input" placeholder="Correo electrónico" required>
                        
                        <button type="submit" class="btn-recover">Enviar enlace</button>
                    </form>

                    <p class="back-to-login">
                        <a href="index.html">Volver al inicio de sesión</a>
                    </p>
                </div>

                <img src="../assets/logo_ucv.png" alt="UCV" style="width: 65px; margin-top: 20px;">

            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
